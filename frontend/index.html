
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alerta Ciudadana | Reportar emergencia</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/app.js" defer></script>
</head>
<body>
  <header>
    <h1>Alerta Ciudadana</h1>
    <p>Plataforma de Reporte y Gestión de Emergencias</p>
  </header>

  <main>
    <section class="tarjeta">
      <h2>Reportar una emergencia</h2>
      <p>Completa la información del incidente.</p>

      <form id="formEmergencia">
        <label for="tipo">Tipo de emergencia</label>
        <select id="tipo" required>
          <option value="">Selecciona una opción</option>
          <option>Incendio</option>
          <option>Accidente</option>
          <option>Inundación</option>
          <option>Emergencia médica</option>
          <option>Otra</option>
        </select>

        <label for="descripcion">Descripción</label>
        <textarea id="descripcion" minlength="10"
          maxlength="1000" required
          placeholder="Describe lo sucedido"></textarea>

        <label for="latitud">Latitud</label>
        <input id="latitud" type="number" step="any"
          min="-90" max="90" required>

        <label for="longitud">Longitud</label>
        <input id="longitud" type="number" step="any"
          min="-180" max="180" required>

        <button type="submit">Enviar reporte</button>
      </form>

      <p id="mensaje" role="status" aria-live="polite"></p>
    </section>

    <section class="tarjeta">
      <h2>Emergencias registradas</h2>
      <button id="actualizar" type="button">
        Actualizar listado
      </button>
      <div id="listaEmergencias"></div>
    </section>
  </main>

  <footer>
    <p>Prototipo académico UNAD — Datos de prueba.</p>
    <p>Para emergencias reales en Colombia, llama al 123.</p>
  </footer>
</body>
</html>
